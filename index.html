        function isExtensionError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err.stack || err || '');

            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('ethereum') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          if (
            isExtensionError(e.error) ||
            isExtensionError(e.message) ||
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1)
          ) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isExtensionError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
